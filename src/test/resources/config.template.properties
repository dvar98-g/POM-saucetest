# Plantilla de configuración del entorno de pruebas.
# Copia este archivo como "config.properties" (sin .template) y ajusta los valores según tu entorno.
# En CI (ej. GitHub Actions), estos valores pueden definirse como variables de entorno
# (BASE_URL, DEFAULT_TIMEOUT_SECONDS) y config.properties ni siquiera es necesario.

base.url=URL_DEL_SITIO_WEB
default.timeout.seconds=TIEMPO_DE_ESPERA

# Pausa en milisegundos después de cada acción de UI (click/escribir), útil para
# seguir el test visualmente más despacio. Opcional: si se omite, se asume 0.
# En CI conviene dejarla en 0 (o quitarla) para no ralentizar la ejecución.
action.delay.millis=TIEMPO_DE_ACCION
